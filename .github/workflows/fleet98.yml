name: Fleet98 builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fleet98/**', 'web/**', 'android/**', 'desktop/**', 'tests/**', 'package.json', '.github/workflows/fleet98.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: project
        shell: bash
        run: |
          if [ -d fleet98/web ]; then echo 'dir=fleet98' >> "$GITHUB_OUTPUT"; else echo 'dir=.' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: ${{ steps.project.outputs.dir }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash android/build.sh
        working-directory: ${{ steps.project.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet98-Android-test-APK
          path: '${{ steps.project.outputs.dir }}/android/build/Fleet98-debug.apk'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: project
        shell: bash
        run: |
          if [ -d fleet98/web ]; then echo 'dir=fleet98' >> "$GITHUB_OUTPUT"; else echo 'dir=.' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: cp -r web desktop/web
      - run: npm ci
        working-directory: '${{ steps.project.outputs.dir }}/desktop'
      - run: npm run package:win
        working-directory: '${{ steps.project.outputs.dir }}/desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet98-Windows-x64-portable
          path: '${{ steps.project.outputs.dir }}/dist/Fleet98-win32-x64/'
