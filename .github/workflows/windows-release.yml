name: Windows installer
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies
        working-directory: windows
        run: npm ci
      - name: Test update handling
        working-directory: windows
        run: npm test
      - name: Build Windows x64 installer
        working-directory: windows
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and test the packaged application
        shell: pwsh
        run: |
          $installer = Get-ChildItem windows/dist/*-x64.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'Notepad98Installed'
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'Notepad98-old.exe'
          Invoke-WebRequest 'https://github.com/BabyCRTTV/notepad98/releases/download/windows-v1.8.3/Notepad98-Setup-1.8.3-x64.exe' -OutFile $oldInstaller
          $old = Start-Process $oldInstaller -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($old.ExitCode -ne 0) { throw 'Previous version install failed' }
          $data = Join-Path $env:APPDATA 'notepad98-desktop'
          New-Item -ItemType Directory -Force $data | Out-Null
          $marker = Join-Path $data 'upgrade-preservation.txt'
          'keep my settings' | Set-Content $marker
          $install = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Install failed: $($install.ExitCode)" }
          if ((Get-Content $marker) -ne 'keep my settings') { throw 'Upgrade removed user data' }
          $exe = Join-Path $destination 'Notepad 98.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $env:NOTEPAD98_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 'smoke-result.json'
          $test = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (!$test.WaitForExit(60000)) { $test.Kill(); throw 'App test timed out' }
          if ($test.ExitCode -ne 0 -or !(Test-Path $env:NOTEPAD98_SMOKE_OUTPUT)) { throw 'Installed app test failed' }
          $result = Get-Content $env:NOTEPAD98_SMOKE_OUTPUT | ConvertFrom-Json
          if ($result.version -ne '1.8.4') { throw 'Upgrade did not replace old executable' }
          $result.checks += 'upgrade from 1.8.3 with user data preserved'
          $result | ConvertTo-Json | Set-Content $env:NOTEPAD98_SMOKE_OUTPUT
          Get-Content $env:NOTEPAD98_SMOKE_OUTPUT
          Copy-Item $env:NOTEPAD98_SMOKE_OUTPUT windows/dist/smoke-result.json
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content windows/dist/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: notepad98-windows
          path: |
            windows/dist/*-x64.exe
            windows/dist/SHA256SUMS-Windows.txt
            windows/dist/smoke-result.json
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content windows/package.json | ConvertFrom-Json).version
          $tag = "windows-v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump the version to publish a new installer." }
          gh release create $tag windows/dist/*-x64.exe windows/dist/SHA256SUMS-Windows.txt windows/dist/smoke-result.json --target $env:GITHUB_SHA --title "Notepad 98 for Windows $version" --notes-file windows/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Publish Windows update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content windows/package.json | ConvertFrom-Json).version
          $current = gh api repos/BabyCRTTV/notepad98/contents/updates.json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read update feed' }
          $feed = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($current.content)) | ConvertFrom-Json
          $installer = Get-ChildItem windows/dist/*-x64.exe | Select-Object -First 1
          $feed.windows = @{version=$version; url="https://github.com/BabyCRTTV/notepad98/releases/download/windows-v$version/$($installer.Name)"; sha256=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower(); notes='Check for updates is now available under Help.'}
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($feed | ConvertTo-Json -Depth 8)))
          @{message="Publish Windows $version update feed"; sha=$current.sha; content=$content} | ConvertTo-Json | Set-Content -Encoding utf8 feed-request.json
          gh api --method PUT repos/BabyCRTTV/notepad98/contents/updates.json --input feed-request.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish update feed' }
